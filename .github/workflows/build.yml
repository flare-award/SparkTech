name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Тесты (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Тесты
        shell: bash
        run: |
          python -m pytest -q || {
            # Публикуем хвост вывода в аннотациях проверки: причина падения
            # видна прямо в интерфейсе GitHub, без скачивания логов.
            python -m pytest -q --tb=line 2>&1 | tail -n 12 | sed -e 's/%/%25/g' -e 's/\r//g' |
              while IFS= read -r line; do echo "::error title=pytest::${line}"; done
            exit 1
          }

  windows-exe:
    name: Сборка SparkTech.exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt pyinstaller pywebview
      # Официальный adb намеренно не скачивается в CI: лицензию Google нужно
      # принимать осознанно. Сборка без adb — рабочее состояние, путь задаётся
      # в настройках приложения.
      - name: Сборка
        shell: bash
        run: |
          # хвост вывода публикуется аннотациями — так причина видна без логов
          python -m PyInstaller SparkTech.spec --noconfirm --clean 2>&1 | tee build.log || true
          status=$(grep -c "^ERROR" build.log || true)
          if [ ! -f dist/SparkTech.exe ]; then
            tail -n 25 build.log | sed -e 's/%/%25/g' -e 's/\r//g' |
              while IFS= read -r line; do echo "::error title=pyinstaller::${line}"; done
            exit 1
          fi
          tail -n 3 build.log
      - name: Проверка, что exe создан
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/SparkTech.exe")) { throw "SparkTech.exe не создан" }
          Get-Item dist/SparkTech.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: SparkTech-windows-exe
          path: dist/SparkTech.exe
          if-no-files-found: error
